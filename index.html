<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Gastos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<!--
╔══════════════════════════════════════════════════════════════════╗
║              INSTRUCCIONES DE CONFIGURACIÓN                       ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  1. FIREBASE CONSOLE → https://console.firebase.google.com       ║
║     • Crear proyecto nuevo                                       ║
║     • Agregar app web (</>)                                      ║
║     • Copiar la config y pegar en firebaseConfig abajo           ║
║                                                                  ║
║  2. AUTENTICACIÓN                                                ║
║     • Authentication → Sign-in method → Email/Password → ON     ║
║     • Authentication → Users → Add user → tu email + contraseña ║
║                                                                  ║
║  3. BASE DE DATOS                                                ║
║     • Firestore Database → Crear base de datos → Modo producción ║
║                                                                  ║
║  4. REGLAS DE SEGURIDAD (Firestore → Rules → Publicar)          ║
║     ─────────────────────────────────────────────────           ║
║     rules_version = '2';                                         ║
║     service cloud.firestore {                                    ║
║       match /databases/{database}/documents {                    ║
║         match /{document=**} {                                   ║
║           allow read, write: if request.auth != null             ║
║             && request.auth.uid == "TU_UID_AQUI";               ║
║         }                                                        ║
║       }                                                          ║
║     }                                                            ║
║     ─────────────────────────────────────────────────           ║
║     Para obtener tu UID: logearte → consola F12 →               ║
║       firebase.auth().currentUser.uid                            ║
║                                                                  ║
║  5. GITHUB PAGES                                                 ║
║     • Crear repo → subir este archivo como index.html           ║
║     • Settings → Pages → Branch: main → Save                    ║
║                                                                  ║
╚══════════════════════════════════════════════════════════════════╝
-->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f7f7f5;
    --border: #e8e8e4;
    --text: #1a1a1a;
    --text-soft: #6b6b65;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --red: #dc2626;
    --red-light: #fef2f2;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --amber: #d97706;
    --amber-light: #fffbeb;
    --purple: #7c3aed;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ─── AUTH ─────────────────────────────────────── */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .auth-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow-md);
  }

  .auth-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    margin-bottom: 4px;
  }

  .auth-sub {
    color: var(--text-soft);
    font-size: 15px;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 13px;
    font-size: 15px;
    font-family: inherit;
    background: white;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
  }

  .auth-error {
    background: var(--red-light);
    border: 1px solid #fecaca;
    color: var(--red);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }

  /* ─── BUTTONS ───────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    line-height: 1;
  }

  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-danger { background: var(--red-light); color: var(--red); border-color: #fecaca; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-success { background: var(--green-light); color: var(--green); border-color: #bbf7d0; }
  .btn-success:hover { background: #dcfce7; }
  .btn-full { width: 100%; justify-content: center; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-icon { padding: 5px 9px; font-size: 14px; }

  /* ─── APP LAYOUT ─────────────────────────────────── */
  #app { display: none; min-height: 100vh; flex-direction: column; }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    box-shadow: var(--shadow);
  }

  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 23px;
  }

  /* ─── MES STRIP ─────────────────────────────────── */
  .mes-strip {
    position: sticky;
    top: 56px;
    z-index: 90;
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .mes-nav { display: flex; align-items: center; gap: 6px; }

  .mes-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 12px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-soft);
    transition: all 0.15s;
    font-family: inherit;
  }

  .mes-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  .mes-pill {
    background: var(--accent);
    color: white;
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .mes-full {
    font-family: 'DM Serif Display', serif;
    font-size: 21px;
    color: var(--text);
  }

  /* ─── RESUMEN BAR ───────────────────────────────── */
  .resumen-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    overflow-x: auto;
  }

  .rb-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 4px 18px 4px 0;
    margin-right: 18px;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  .rb-item:last-child { border-right: none; margin-right: 0; }
  .rb-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); font-weight: 600; }
  .rb-val { font-size: 20px; font-weight: 600; }

  /* ─── MAIN ──────────────────────────────────────── */
  main {
    flex: 1;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  /* ─── SECCIÓN ───────────────────────────────────── */
  .seccion {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .sec-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    gap: 8px;
  }

  .sec-header-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .sec-titulo { font-weight: 600; font-size: 18px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec-header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .sec-total { font-size: 18px; font-weight: 600; color: var(--text-soft); }
  .sec-chevron { font-size: 13px; color: var(--text-soft); transition: transform 0.2s; }

  .seccion.collapsed .sec-chevron { transform: rotate(-90deg); }
  .seccion.collapsed .sec-body { display: none; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .d-blue   { background: var(--accent); }
  .d-red    { background: var(--red); }
  .d-green  { background: var(--green); }
  .d-amber  { background: var(--amber); }
  .d-purple { background: var(--purple); }

  /* ─── ITEMS ─────────────────────────────────────── */
  .item-row {
    display: grid;
    grid-template-columns: 1fr minmax(55px,80px) minmax(55px,90px) auto auto auto;
    align-items: center;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .ic-fin { color: var(--text-soft); font-size: 13px; white-space: nowrap; padding: 4px 6px; }

  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: #fafaf8; }

  .ic { padding: 9px 13px; font-size: 18px; }
  .ic-nombre { color: var(--text); }
  .ic-cuotas { color: var(--text-soft); font-size: 14px; white-space: nowrap; }
  .ic-monto  { font-weight: 500; white-space: nowrap; text-align: right; }
  .ic-estado { text-align: center; white-space: nowrap; }
  .ic-acciones { display: flex; gap: 3px; padding: 6px 9px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: nowrap;
    transition: background 0.12s;
  }

  .badge-ok  { background: var(--green-light); color: var(--green); border-color: #bbf7d0; }
  .badge-ok:hover { background: #dcfce7; }
  .badge-no  { background: var(--red-light); color: var(--red); border-color: #fecaca; }
  .badge-no:hover { background: #fee2e2; }
  .empty-msg {
    padding: 12px 16px;
    color: var(--text-soft);
    font-size: 14px;
    font-style: italic;
  }

  /* ─── ADD ROW ───────────────────────────────────── */
  .add-row {
    display: flex;
    gap: 6px;
    padding: 9px 12px;
    background: #fafaf8;
    border-top: 1px dashed var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  .add-row input, .add-row select {
    flex: 1;
    min-width: 90px;
    padding: 7px 10px;
    font-size: 14px;
  }

  .add-row .inp-cuotas { max-width: 90px; flex: 0 0 90px; }
  .add-row .inp-monto  { max-width: 120px; flex: 0 0 120px; }

  /* ─── COBRADO ───────────────────────────────────── */
  .cobrado-val { color: var(--green); font-weight: 500; }

  /* ─── RESUMEN FINAL ─────────────────────────────── */
  .resumen-final {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .rf-header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
  }

  .rf-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .rf-celda {
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }

  .rf-celda:last-child { border-right: none; }
  .rf-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-soft); margin-bottom: 4px; font-weight: 600; }
  .rf-val   { font-size: 22px; font-weight: 700; }

  /* ─── MODAL ─────────────────────────────────────── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.38);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 14px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    overflow: hidden;
    animation: modalIn 0.18s ease;
  }

  @keyframes modalIn { from { opacity:0; transform: scale(0.96); } }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-close {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: var(--text-soft); line-height: 1; padding: 0;
  }

  .modal-body { padding: 20px; }
  .modal-footer { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

  /* ─── TOAST ─────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: white;
    padding: 9px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── LOADING ───────────────────────────────────── */
  .loading-wrap {
    display: none;
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.75);
    z-index: 500;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-direction: column;
  }

  .loading-wrap.show { display: flex; }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── GRÁFICOS ──────────────────────────────────── */
  .grafico-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    padding: 16px 14px;
  }
  .grafico-titulo {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }
  .grafico-canvas-wrap { display: flex; justify-content: center; }
  .grafico-leyenda { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .ley-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-soft); }
  .ley-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .ley-val { font-weight: 600; color: var(--text); margin-left: 2px; }

  /* ─── RESPONSIVE ────────────────────────────────── */
  @media (max-width: 580px) {
    body { font-size: 23px; }
    header, .mes-strip { padding-left: 14px; padding-right: 14px; }
    header { height: 68px; }
    .header-title { font-size: 30px; }
    main { padding: 12px 14px; }
    .ic { padding: 14px 10px; font-size: 22px; }
    .ic-cuotas { display: none; }
    .ic-monto { font-size: 22px; }
    .item-row { grid-template-columns: 1fr auto auto auto; }
    .rf-grid { grid-template-columns: 1fr 1fr; }
    .rf-celda:nth-child(2) { border-right: none; }
    .rf-celda:nth-child(3) { grid-column: 1/-1; border-top: 1px solid var(--border); border-right: none; }
    .resumen-bar { padding: 10px 14px; }
    .rb-item { padding-right: 12px; margin-right: 12px; }
    .rb-label { font-size: 16px; }
    .rb-val { font-size: 26px; }
    .sec-titulo { font-size: 23px; }
    .sec-total { font-size: 23px; }
    .btn { font-size: 20px; padding: 13px 22px; }
    .btn-sm { font-size: 18px; padding: 10px 16px; }
    .btn-icon { font-size: 20px; padding: 8px 13px; }
    .badge { font-size: 18px; padding: 7px 15px; }
    .mes-full { font-size: 30px; }
    .mes-pill { font-size: 17px; padding: 5px 18px; }
    .rf-val { font-size: 30px; }
    .rf-label { font-size: 16px; }
    .rf-header { font-size: 21px; }
    .empty-msg { font-size: 20px; }
    .add-row input, .add-row select { font-size: 20px; }
    input[type="text"], input[type="number"], input[type="email"], input[type="password"], select { font-size: 21px; padding: 13px 15px; }
    .ic-fin { font-size: 17px; }
    .sec-chevron { font-size: 19px; }
    .grafico-titulo { font-size: 17px; }
    .ley-item { font-size: 17px; }
    .dot { width: 11px; height: 11px; }
  }
</style>
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-title">Mis Gastos</div>
    <div class="auth-sub">Ingresá con tu cuenta</div>
    <div id="auth-error" class="auth-error"></div>
    <button class="btn btn-full" onclick="doLoginGoogle()" style="background:#fff;border:1px solid #dadce0;color:#3c4043;font-weight:500;justify-content:center;gap:10px;margin-bottom:16px;padding:10px;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px;">
      Continuar con Google
    </button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <hr style="flex:1;border:none;border-top:1px solid #e5e7eb;">
      <span style="color:#9ca3af;font-size:12px;">o</span>
      <hr style="flex:1;border:none;border-top:1px solid #e5e7eb;">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="app">

  <header>
    <span class="header-title">Mis Gastos</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="abrirCopiarMes()">📋 Copiar mes ant.</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div class="mes-strip">
    <div class="mes-nav">
      <button class="mes-btn" onclick="cambiarMes(-1)">‹</button>
      <span class="mes-pill" id="mes-pill">—</span>
      <button class="mes-btn" onclick="cambiarMes(1)">›</button>
    </div>
    <span class="mes-full" id="mes-full">—</span>
  </div>

  <div class="resumen-bar" id="resumen-bar">
    <div class="rb-item">
      <span class="rb-label">Total gastos</span>
      <span class="rb-val" id="rb-total" style="color:var(--red)">$0</span>
    </div>
    <div class="rb-item">
      <span class="rb-label">Cobrado</span>
      <span class="rb-val" id="rb-cobrado" style="color:var(--green)">$0</span>
    </div>
    <div class="rb-item">
      <span class="rb-label">Quedan</span>
      <span class="rb-val" id="rb-quedan">$0</span>
    </div>
    <div class="rb-item">
      <span class="rb-label">Pagado</span>
      <span class="rb-val" id="rb-pagado" style="color:var(--green)">$0</span>
    </div>
    <div class="rb-item">
      <span class="rb-label">Pendiente</span>
      <span class="rb-val" id="rb-pendiente" style="color:var(--amber)">$0</span>
    </div>
  </div>

  <main id="main"></main>
</div>

<div id="toast"></div>

<div class="loading-wrap" id="loading">
  <div class="spinner"></div>
  <span style="font-size:13px;color:var(--text-soft)">Cargando...</span>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span id="m-titulo">—</span>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-footer" id="m-footer"></div>
  </div>
</div>

                     FIREBASE + LÓGICA
════════════════════════════════════════════════════ -->
<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ──────────────────────────────────────────────────────
   🔧  REEMPLAZÁ ESTOS VALORES CON TU CONFIG DE FIREBASE
   ────────────────────────────────────────────────────── */
const firebaseConfig = {
  apiKey:            "AIzaSyDj9Q_KoIkQzpMxj_b96V-wqRPhWV2gYjs",
  authDomain:        "gastos-23772.firebaseapp.com",
  projectId:         "gastos-23772",
  storageBucket:     "gastos-23772.firebasestorage.app",
  messagingSenderId: "478136024549",
  appId:             "1:478136024549:web:d4420b22b6119c0543c30c"
};
/* ──────────────────────────────────────────────────── */

const fapp = initializeApp(firebaseConfig);
const auth = getAuth(fapp);
const db   = getFirestore(fapp);

// ── Constantes ────────────────────────────────────────
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
               "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const SECCIONES_BASE = () => [
  { id:"alquiler",  titulo:"Alquiler / Vivienda",  dot:"d-blue"   },
  { id:"servicios", titulo:"Servicios",             dot:"d-amber"  },
  { id:"extras",    titulo:"Extras y Variables",    dot:"d-purple" },
  { id:"debito",    titulo:"Débito / Red Link",     dot:"d-red"    },
  { id:"naranja",   titulo:"Tarjeta Naranja",       dot:"d-red"    },
  { id:"nativa",    titulo:"Tarjeta Nativa",        dot:"d-green"  },
  { id:"visa",      titulo:"Tarjeta Visa Nación",   dot:"d-blue"   },
  { id:"otros",     titulo:"Otros / Extra",         dot:"d-amber"  },
].map(s => ({ ...s, items: [] }));

// ── Estado ────────────────────────────────────────────
const S = {
  year:  new Date().getFullYear(),
  month: new Date().getMonth(),
  data:  null,
};

let saveTimer = null;

// ── Auth ──────────────────────────────────────────────
onAuthStateChanged(auth, u => {
  if (u) {
    q("auth-screen").style.display = "none";
    q("app").style.cssText = "display:flex;flex-direction:column;";
    cargarMes();
  } else {
    q("auth-screen").style.display = "flex";
    q("app").style.display = "none";
  }
});

window.doLogin = async () => {
  const email = document.getElementById("login-email").value.trim();
  const pass  = document.getElementById("login-pass").value;
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  if (!email || !pass) {
    errEl.textContent = "Completá email y contraseña.";
    errEl.style.display = "block";
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    errEl.textContent = "Email o contraseña incorrectos.";
    errEl.style.display = "block";
  }
};

window.doLoginGoogle = async () => {
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  } catch(e) {
    errEl.textContent = "No se pudo iniciar sesión con Google.";
    errEl.style.display = "block";
  }
};

window.doLogout = () => signOut(auth);

// ── Firestore ─────────────────────────────────────────
function mesKey() {
  return `${S.year}-${String(S.month+1).padStart(2,"0")}`;
}

async function cargarMes() {
  loading(true);
  try {
    const snap = await getDoc(doc(db, "gastos", mesKey()));
    S.data = snap.exists() ? snap.data() : {
      secciones: SECCIONES_BASE(),
      cobrado:   [],
      extras:    [],
    };
    // compatibilidad: asegurar arrays
    if (!S.data.secciones) S.data.secciones = SECCIONES_BASE();
    if (!S.data.cobrado)   S.data.cobrado   = [];
    if (!S.data.extras)    S.data.extras    = [];
    S.data.secciones.forEach(s => { if (!s.items) s.items = []; });
  } catch(e) {
    toast("Error al cargar datos");
    S.data = { secciones: SECCIONES_BASE(), cobrado: [] };
  }
  loading(false);
  render();
}

function guardar() {
  if (!auth.currentUser) return;
  setDoc(doc(db, "gastos", mesKey()), S.data)
    .then(() => toast("✓ Guardado"))
    .catch(() => toast("Error al guardar"));
}

function guardarDebounced() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(guardar, 1000);
}

// Copiar mes anterior
window.abrirCopiarMes = () => {
  abrirModal("Copiar mes anterior",
    `<p style="color:var(--text-soft);font-size:14px;">
      Se copiará la <strong>estructura y montos</strong> del mes anterior.<br>
      Los estados de pago se resetearán a pendiente.
    </p>`,
    async () => {
      const pm = S.month === 0 ? 11 : S.month - 1;
      const py = S.month === 0 ? S.year - 1 : S.year;
      const key = `${py}-${String(pm+1).padStart(2,"0")}`;
      cerrarModal();
      loading(true);
      try {
        const snap = await getDoc(doc(db, "gastos", key));
        if (snap.exists()) {
          const prev = snap.data();
          S.data.secciones = deep(prev.secciones).map(s => ({
            ...s, items: (s.items||[]).map(it => ({ ...it, pagado: false }))
          }));
          S.data.cobrado = deep(prev.cobrado||[]).map(c => ({ ...c, monto: 0 }));
          guardar();
          render();
          toast("Estructura copiada — ajustá los montos");
        } else {
          toast("No hay datos del mes anterior");
        }
      } catch(e) { toast("Error al copiar"); }
      loading(false);
    },
    "Copiar", "btn-primary"
  );
};

// ── Navegación ────────────────────────────────────────
window.cambiarMes = (d) => {
  S.month += d;
  if (S.month > 11) { S.month = 0; S.year++; }
  if (S.month <  0) { S.month = 11; S.year--; }
  cargarMes();
};

// ── Render ────────────────────────────────────────────
function render() {
  // Header mes
  const nom = MESES[S.month];
  q("mes-pill").textContent = nom.slice(0,3).toUpperCase() + " " + S.year;
  q("mes-full").textContent = nom + " " + S.year;

  // Totales
  let tot = 0, pag = 0, pend = 0;
  S.data.secciones.forEach((s, si) => {
    const esTar = esTarjetaSec((s.titulo||"").toLowerCase());
    // items normales
    // Las secciones de tarjeta NO se suman al total (ya están incluidas en Débito/Red Link)
    (s.items||[]).forEach(it => {
      const m = num(it.monto);
      if (!esTar) {
        tot += m;
        if (it.pagado) pag += m; else pend += m;
      }
    });
    // cats (Extras y Variables)
    (s.cats||[]).forEach(cat => {
      const m = (cat.items||[]).reduce((a,i) => a + num(i.monto), 0);
      tot += m;
      if (cat.pagado) pag += m; else pend += m;
    });
  });
  const cob    = S.data.cobrado.reduce((a,c) => a + num(c.monto), 0);
  const extraTot = (S.data.extras||[]).reduce((a,e) => a + (e.items||[]).reduce((b,i) => b + num(i.monto), 0), 0);
  const totalIngresos = cob + extraTot;
  const quedan = totalIngresos - tot;

  q("rb-total").textContent    = ars(tot);
  q("rb-cobrado").textContent  = ars(totalIngresos);
  q("rb-quedan").textContent   = ars(quedan);
  q("rb-pagado").textContent   = ars(pag);
  q("rb-pendiente").textContent= ars(pend);
  q("rb-quedan").style.color   = quedan >= 0 ? "var(--green)" : "var(--red)";

  // Secciones
  const main = q("main");
  main.innerHTML = "";

  S.data.secciones.forEach((sec, si) => {
    main.appendChild(buildSeccion(sec, si));
  });

  // Botón nueva sección
  const b = ce("button");
  b.className = "btn btn-ghost btn-sm";
  b.style.cssText = "margin-bottom:14px;";
  b.textContent = "+ Nueva sección";
  b.onclick = nuevaSeccion;
  main.appendChild(b);

  // Ingresos Extra
  main.appendChild(buildExtras());

  // Cobrado
  main.appendChild(buildCobrado());

  // Resumen
  main.appendChild(buildResumen(tot, totalIngresos, quedan));

  // Gráficos
  main.appendChild(buildGraficos(tot, totalIngresos, quedan, pag, pend));
}

function esSeccionDesplegable(sec) {
  const t = (sec.titulo||"").toLowerCase();
  return t.includes("extra") || t.includes("variable");
}

function buildSeccion(sec, si) {
  const totSec = (sec.items||[]).reduce((a,it) => a + num(it.monto), 0)
               + (sec.cats||[]).reduce((a,cat) => a + (cat.items||[]).reduce((b,i) => b + num(i.monto), 0), 0);
  const wrap = ce("div");
  wrap.className = "seccion";
  wrap.dataset.si = si;

  // header
  const hdr = ce("div");
  hdr.className = "sec-header";
  hdr.innerHTML = `
    <div class="sec-header-left">
      <span class="dot ${sec.dot||'d-blue'}"></span>
      <span class="sec-titulo">${esc(sec.titulo)}</span>
    </div>
    <div class="sec-header-right">
      <span class="sec-total">${ars(totSec)}</span>
      <button class="btn btn-ghost btn-icon btn-sm" title="Editar sección">✏️</button>
      <button class="btn btn-danger btn-icon btn-sm" title="Eliminar sección">🗑</button>
      <span class="sec-chevron">▼</span>
    </div>
  `;

  hdr.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    wrap.classList.toggle("collapsed");
  });

  hdr.querySelectorAll("button")[0].addEventListener("click", e => {
    e.stopPropagation();
    editarSeccion(si);
  });

  hdr.querySelectorAll("button")[1].addEventListener("click", e => {
    e.stopPropagation();
    eliminarSeccion(si);
  });

  wrap.appendChild(hdr);

  // body
  const body = ce("div");
  body.className = "sec-body";

  if (esSeccionDesplegable(sec)) {
    // Modo categorías desplegables igual que Ingresos Extra
    // sec.cats = [{label, items:[{nota,monto}], pagado}]
    if (!sec.cats) sec.cats = [];

    // Migrar items viejos como categorías si existen
    if (sec.items && sec.items.length && !sec.cats.length) {
      sec.items.forEach(it => {
        sec.cats.push({ label: it.nombre, items: it.monto ? [{nota:"", monto: num(it.monto)}] : [], pagado: it.pagado||false });
      });
      sec.items = [];
      guardarDebounced();
    }

    if (!sec.cats.length) {
      const em = ce("div"); em.className = "empty-msg";
      em.textContent = "Agregá categorías abajo ↓";
      body.appendChild(em);
    } else {
      sec.cats.forEach((cat, ci) => {
        const catTotal = (cat.items||[]).reduce((a,i) => a + num(i.monto), 0);
        const catWrap = ce("div");
        catWrap.style.cssText = "border-bottom:1px solid var(--border);";

        const catHdr = ce("div");
        catHdr.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#fafaf8;cursor:pointer;user-select:none;";
        catHdr.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;">
            <span class="g-arrow" style="font-size:11px;color:var(--text-soft);">▶</span>
            ${esc(cat.label)}
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:13px;font-weight:600;">${ars(catTotal)}</span>
            <span class="badge ${cat.pagado ? 'badge-ok' : 'badge-no'}" style="font-size:11px;">
              ${cat.pagado ? "✓ Pagado" : "✗ Pendiente"}
            </span>
            <button class="btn btn-ghost btn-icon btn-sm">✏️</button>
            <button class="btn btn-danger btn-icon btn-sm">✕</button>
          </div>
        `;

        const catBody = ce("div");
        catBody.style.display = "none";

        catHdr.addEventListener("click", e => {
          if (e.target.closest("button")) return;
          const open = catBody.style.display !== "none";
          catBody.style.display = open ? "none" : "block";
          catHdr.querySelector(".g-arrow").textContent = open ? "▶" : "▼";
        });

        catHdr.querySelector(".badge").addEventListener("click", e => {
          e.stopPropagation();
          S.data.secciones[si].cats[ci].pagado = !cat.pagado;
          guardarDebounced(); render();
        });

        catHdr.querySelectorAll("button")[0].addEventListener("click", e => {
          e.stopPropagation();
          abrirModal("Editar categoría", `
            <div class="field"><label>Nombre</label>
              <input type="text" id="m-cl" value="${esc(cat.label)}">
            </div>
          `, () => {
            S.data.secciones[si].cats[ci].label = q("m-cl").value.trim() || cat.label;
            guardarDebounced(); cerrarModal(); render();
          });
        });

        catHdr.querySelectorAll("button")[1].addEventListener("click", e => {
          e.stopPropagation();
          S.data.secciones[si].cats.splice(ci, 1);
          guardarDebounced(); render();
        });

        catWrap.appendChild(catHdr);

        // Sub-items
        (cat.items||[]).forEach((it, ii) => {
          const iRow = ce("div");
          iRow.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:7px 12px 7px 32px;border-top:1px solid var(--border);font-size:13px;";
          iRow.innerHTML = `
            <span style="color:var(--text-soft);">${esc(it.nota || ("Cobro " + (ii+1)))}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:500;">${ars(num(it.monto))}</span>
              <button class="btn btn-ghost btn-icon btn-sm">✏️</button>
              <button class="btn btn-danger btn-icon btn-sm">✕</button>
            </div>
          `;
          iRow.querySelectorAll("button")[0].addEventListener("click", () => {
            abrirModal("Editar cobro", `
              <div class="field"><label>Nota (opcional)</label>
                <input type="text" id="m-in" value="${esc(it.nota||'')}">
              </div>
              <div class="field"><label>Monto ($)</label>
                <input type="number" id="m-im" value="${it.monto||0}" min="0">
              </div>
            `, () => {
              S.data.secciones[si].cats[ci].items[ii].nota  = q("m-in").value.trim();
              S.data.secciones[si].cats[ci].items[ii].monto = parseFloat(q("m-im").value)||0;
              guardarDebounced(); cerrarModal(); render();
            });
          });
          iRow.querySelectorAll("button")[1].addEventListener("click", () => {
            S.data.secciones[si].cats[ci].items.splice(ii, 1);
            guardarDebounced(); render();
          });
          catBody.appendChild(iRow);
        });

        // Agregar monto dentro de categoría
        const addI = ce("div");
        addI.style.cssText = "display:flex;gap:6px;padding:7px 12px 7px 32px;border-top:1px dashed var(--border);background:#f9f9f7;";
        addI.innerHTML = `
          <input type="text"   class="inp-nota"   placeholder="Nota (opcional)" style="flex:1;padding:5px 8px;font-size:12px;">
          <input type="number" class="inp-imonto"  placeholder="Monto $" min="0" style="width:110px;padding:5px 8px;font-size:12px;">
          <button class="btn btn-success btn-sm" style="font-size:12px;">+ Agregar</button>
        `;
        const iN = addI.querySelector(".inp-nota");
        const iM = addI.querySelector(".inp-imonto");
        const iB = addI.querySelector("button");
        const addMonto = () => {
          const monto = parseFloat(iM.value)||0;
          if (!monto) { toast("Ingresá un monto"); return; }
          if (!S.data.secciones[si].cats[ci].items) S.data.secciones[si].cats[ci].items = [];
          S.data.secciones[si].cats[ci].items.push({ nota: iN.value.trim(), monto });
          guardarDebounced(); render();
        };
        iB.addEventListener("click", addMonto);
        iM.addEventListener("keydown", ev => { if(ev.key==="Enter") addMonto(); });
        catBody.appendChild(addI);

        catWrap.appendChild(catBody);
        body.appendChild(catWrap);
      });
    }

    // Agregar nueva categoría
    const addCat = ce("div");
    addCat.className = "add-row";
    addCat.innerHTML = `
      <input type="text" class="inp-cat2" placeholder="Nueva categoría (ej: Nafta, Comida)" style="flex:1;">
      <button class="btn btn-success btn-sm">+ Agregar categoría</button>
    `;
    const cI = addCat.querySelector(".inp-cat2");
    const cB = addCat.querySelector("button");
    const addCat2 = () => {
      const label = cI.value.trim();
      if (!label) { toast("Ingresá un nombre"); return; }
      if (!S.data.secciones[si].cats) S.data.secciones[si].cats = [];
      S.data.secciones[si].cats.push({ label, items:[], pagado: false });
      guardarDebounced(); render();
    };
    cB.addEventListener("click", addCat2);
    cI.addEventListener("keydown", ev => { if(ev.key==="Enter") addCat2(); });
    body.appendChild(addCat);
    // NO buildAddRow for desplegable sections - category add is enough

  } else {
    if (!sec.items || !sec.items.length) {
      const em = ce("div"); em.className = "empty-msg";
      em.textContent = "Sin items. Agregá uno abajo ↓";
      body.appendChild(em);
    } else {
      sec.items.forEach((it, ii) => body.appendChild(buildItem(it, si, ii)));
    }
  }

  if (!esSeccionDesplegable(sec)) {
    body.appendChild(buildAddRow(si));
  }
  wrap.appendChild(body);
  return wrap;
}

const MESES_NOMBRES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function calcFinCuota(cuotaStr) {
  // Acepta "2/6", "2 de 6", "2-6"
  if (!cuotaStr) return "";
  const m = cuotaStr.replace(/\s+de\s+/i,"/").replace("-","/").match(/(\d+)\/(\d+)/);
  if (!m) return "";
  const actual = parseInt(m[1]), total = parseInt(m[2]);
  if (!actual || !total || actual > total) return "";
  const restantes = total - actual;
  const hoy = new Date(S.year, S.month, 1);
  hoy.setMonth(hoy.getMonth() + restantes);
  return MESES_NOMBRES[hoy.getMonth()] + " " + hoy.getFullYear();
}

function esTarjeta(si) {
  return esTarjetaSec((S.data.secciones[si]?.titulo||"").toLowerCase());
}

function getTarjetaTotal(nombre) {
  if (!S.data.secciones) return null;
  const n = nombre.trim().toLowerCase();
  // Match exacto: el titulo de la seccion debe ser igual al nombre del item
  const sec = S.data.secciones.find(s => (s.titulo||"").trim().toLowerCase() === n);
  if (!sec) return null;
  return (sec.items||[]).reduce((a,i) => a + num(i.monto), 0);
}

function esTarjetaSec(t) {
  return t.includes("tarjeta") || t.includes("naranja") || t.includes("visa") || t.includes("nativa") || t.includes("master") || t.includes("amex");
}

function buildItem(it, si, ii) {
  const row = ce("div");
  row.className = "item-row";
  const fin = calcFinCuota(it.cuotas);
  const esTar = esTarjeta(si);
  // Auto-sum from tarjeta section if this item references one
  const secTitulo = (S.data.secciones[si]?.titulo||"").toLowerCase();
  const esDebitoSec = secTitulo.includes("débito") || secTitulo.includes("debito") || secTitulo.includes("red link");
  if (esDebitoSec && it.nombre) {
    const autoTotal = getTarjetaTotal(it.nombre);
    if (autoTotal !== null && autoTotal !== num(it.monto)) {
      // Auto-update the monto to match tarjeta total
      S.data.secciones[si].items[ii].monto = autoTotal;
      it = S.data.secciones[si].items[ii];
    }
  }
  const cuotasHtml = it.cuotas
    ? `<div class="ic ic-cuotas">${esc(it.cuotas)}</div>`
    : `<div class="ic ic-cuotas"></div>`;
  const finHtml = fin
    ? `<div class="ic ic-fin">fin: ${fin}</div>`
    : `<div class="ic ic-fin"></div>`;

  const badgeHtml = esTar ? "" : `
    <div class="ic ic-estado">
      <span class="badge ${it.pagado ? 'badge-ok' : 'badge-no'}">
        ${it.pagado ? "✓ Pagado" : "✗ Pendiente"}
      </span>
    </div>`;

  row.innerHTML = `
    <div class="ic ic-nombre">${esc(it.nombre)}</div>
    ${cuotasHtml}
    ${finHtml}
    <div class="ic ic-monto">${ars(num(it.monto))}</div>
    ${badgeHtml}
    <div class="ic-acciones">
      <button class="btn btn-ghost btn-icon btn-sm" title="Editar">✏️</button>
      <button class="btn btn-danger btn-icon btn-sm" title="Eliminar">✕</button>
    </div>
  `;

  if (!esTar) {
    row.querySelector(".badge").addEventListener("click", () => {
      S.data.secciones[si].items[ii].pagado = !S.data.secciones[si].items[ii].pagado;
      guardarDebounced();
      render();
    });
  }

  row.querySelectorAll("button")[0].addEventListener("click", () => editarItem(si, ii));
  row.querySelectorAll("button")[1].addEventListener("click", () => {
    S.data.secciones[si].items.splice(ii, 1);
    guardarDebounced();
    render();
  });

  return row;
}

function buildAddRow(si) {
  const row = ce("div");
  row.className = "add-row";
  row.innerHTML = `
    <input type="text"   class="inp-nombre" placeholder="Nombre del gasto" />
    <input type="text"   class="inp-cuotas" placeholder="Cuota (ej: 2/6)" />
    <input type="number" class="inp-monto"  placeholder="Monto $" min="0" />
    <button class="btn btn-primary btn-sm">+ Agregar</button>
  `;

  const inN = row.querySelector(".inp-nombre");
  const inC = row.querySelector(".inp-cuotas");
  const inM = row.querySelector(".inp-monto");
  const btn = row.querySelector("button");

  const agregar = () => {
    const nombre = inN.value.trim();
    if (!nombre) { toast("Ingresá un nombre"); return; }
    S.data.secciones[si].items.push({
      nombre,
      cuotas: inC.value.trim(),
      monto:  parseFloat(inM.value) || 0,
      pagado: false,
    });
    guardarDebounced();
    render();

function buildGraficos(tot, totalIngresos, quedan, pag, pend) {
  const wrap = ce("div");
  const COLORES = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#6366f1"];
  const dpr = window.devicePixelRatio || 1;
  const SZ = 180;

  function drawDona(canvas, slices) {
    const ctx = canvas.getContext("2d");
    const W = canvas.width/dpr, H = canvas.height/dpr;
    const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 6, ri = r * 0.52;
    ctx.clearRect(0,0,W*dpr,H*dpr);
    const total = slices.reduce((a,s) => a + s.val, 0);
    if (!total) return;
    let ang = -Math.PI/2;
    slices.forEach(s => {
      const sweep = (s.val/total)*2*Math.PI;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,ang,ang+sweep); ctx.closePath();
      ctx.fillStyle = s.color; ctx.fill();
      ang += sweep;
    });
    ctx.beginPath(); ctx.arc(cx,cy,ri,0,2*Math.PI);
    ctx.fillStyle = "white"; ctx.fill();
  }

  function drawBarras(canvas, items) {
    const ctx = canvas.getContext("2d");
    const W = canvas.width/dpr;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const max = Math.max(...items.map(i => i.val), 1);
    const barH = 28, gap = 14;
    items.forEach((it, i) => {
      const y = i*(barH+gap);
      const w = (it.val/max)*W;
      ctx.fillStyle = "#f1f5f9";
      ctx.beginPath(); ctx.roundRect(0,y,W,barH,6); ctx.fill();
      if (w > 0) {
        ctx.fillStyle = it.color;
        ctx.beginPath(); ctx.roundRect(0,y,w,barH,6); ctx.fill();
      }
    });
  }

  function makeCanvas(w, h) {
    const c = ce("canvas");
    c.width = w*dpr; c.height = h*dpr;
    c.style.width = w+"px"; c.style.height = h+"px";
    c.getContext("2d").scale(dpr,dpr);
    return c;
  }

  // ── Gráfico 1: Dona gastos por sección ──
  const secSlices = [];
  S.data.secciones.forEach((s, si) => {
    if (esTarjetaSec((s.titulo||"").toLowerCase())) return;
    let t = (s.items||[]).reduce((a,it) => a+num(it.monto),0)
          + (s.cats||[]).reduce((a,cat) => a+(cat.items||[]).reduce((b,i) => b+num(i.monto),0),0);
    if (t > 0) secSlices.push({ label: s.titulo, val: t, color: COLORES[si%COLORES.length] });
  });

  if (secSlices.length) {
    const card1 = ce("div"); card1.className = "grafico-card";
    card1.innerHTML = `<div class="grafico-titulo">Gastos por sección</div>`;
    const cw1 = ce("div"); cw1.className = "grafico-canvas-wrap";
    const c1 = makeCanvas(SZ, SZ);
    cw1.appendChild(c1); card1.appendChild(cw1);
    const ley1 = ce("div"); ley1.className = "grafico-leyenda";
    const totSl = secSlices.reduce((a,s)=>a+s.val,0);
    secSlices.forEach(s => {
      const pct = totSl ? Math.round(s.val/totSl*100) : 0;
      const li = ce("div"); li.className = "ley-item";
      li.innerHTML = `<span class="ley-dot" style="background:${s.color}"></span>${esc(s.label)}<span class="ley-val">${pct}%</span>`;
      ley1.appendChild(li);
    });
    card1.appendChild(ley1);
    wrap.appendChild(card1);
    requestAnimationFrame(() => drawDona(c1, secSlices));
  }

  // ── Gráfico 2: Barras cobrado vs gastos ──
  const W2 = Math.min(360, window.innerWidth - 60);
  const barH2 = 28, gap2 = 14;
  const barItems = [
    { label: "Cobrado", val: totalIngresos, color: "#16a34a" },
    { label: "Gastos",  val: tot,           color: "#dc2626" },
    { label: quedan >= 0 ? "Sobrante" : "Déficit", val: Math.abs(quedan), color: quedan >= 0 ? "#2563eb" : "#f97316" },
  ];
  const card2 = ce("div"); card2.className = "grafico-card";
  card2.innerHTML = `<div class="grafico-titulo">Cobrado vs Gastos</div>`;
  const cw2 = ce("div"); cw2.className = "grafico-canvas-wrap";
  const c2 = makeCanvas(W2, barItems.length*(barH2+gap2)-gap2);
  cw2.appendChild(c2); card2.appendChild(cw2);
  const ley2 = ce("div"); ley2.className = "grafico-leyenda";
  barItems.forEach(it => {
    const li = ce("div"); li.className = "ley-item";
    li.innerHTML = `<span class="ley-dot" style="background:${it.color}"></span>${it.label}<span class="ley-val">${ars(it.val)}</span>`;
    ley2.appendChild(li);
  });
  card2.appendChild(ley2);
  wrap.appendChild(card2);
  requestAnimationFrame(() => drawBarras(c2, barItems));

  // ── Gráfico 3: Dona pagado vs pendiente ──
  if (pag + pend > 0) {
    const slices3 = [
      { label: "Pagado",    val: pag,  color: "#16a34a" },
      { label: "Pendiente", val: pend, color: "#f97316" },
    ].filter(s => s.val > 0);
    const card3 = ce("div"); card3.className = "grafico-card";
    card3.innerHTML = `<div class="grafico-titulo">Pagado vs Pendiente</div>`;
    const cw3 = ce("div"); cw3.className = "grafico-canvas-wrap";
    const c3 = makeCanvas(SZ, SZ);
    cw3.appendChild(c3); card3.appendChild(cw3);
    const ley3 = ce("div"); ley3.className = "grafico-leyenda";
    slices3.forEach(s => {
      const pct = (pag+pend) ? Math.round(s.val/(pag+pend)*100) : 0;
      const li = ce("div"); li.className = "ley-item";
      li.innerHTML = `<span class="ley-dot" style="background:${s.color}"></span>${s.label}<span class="ley-val">${ars(s.val)} (${pct}%)</span>`;
      ley3.appendChild(li);
    });
    card3.appendChild(ley3);
    wrap.appendChild(card3);
    requestAnimationFrame(() => drawDona(c3, slices3));
  }

  return wrap;
}

// ── Modal genérico ────────────────────────────────────
let _modalCb = null;

function abrirModal(titulo, body, onOk, btnTxt="Guardar", btnCls="btn-primary") {
  _modalCb = onOk;
  q("m-titulo").textContent = titulo;
  q("m-body").innerHTML = body;
  q("m-footer").innerHTML = `
    <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
    <button class="btn ${btnCls}" id="m-ok">${btnTxt}</button>
  `;
  q("m-ok").addEventListener("click", () => _modalCb && _modalCb());
  q("overlay").classList.add("open");
  setTimeout(() => {
    const el = q("m-body").querySelector("input,select");
    if (el) { el.focus(); el.select && el.select(); }
  }, 60);
}

window.cerrarModal = () => {
  q("overlay").classList.remove("open");
  _modalCb = null;
};

window.overlayClick = e => {
  if (e.target === q("overlay")) cerrarModal();
};

// ── Helpers ───────────────────────────────────────────
function q(id)     { return document.getElementById(id); }
function ce(tag)   { return document.createElement(tag); }
function num(v)    { return parseFloat(v)||0; }
function deep(o)   { return JSON.parse(JSON.stringify(o)); }
function esc(s)    {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function ars(n) {
  return "$" + (isNaN(n)?0:n).toLocaleString("es-AR",
    { minimumFractionDigits:0, maximumFractionDigits:2 });
}
function toast(msg) {
  const t = q("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function loading(show) {
  q("loading").classList.toggle("show", show);
}

</script>
</body>
</html>
